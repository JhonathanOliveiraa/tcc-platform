# Stakater Reloader: reinicia (rolling update) os Deployments anotados com
# reloader.stakater.com/auto: "true" quando um Secret/ConfigMap que eles usam muda. Assim, a troca de
# um valor no OCI Vault chega aos pods que leem o segredo como variável de ambiente, sem commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.18
    helm:
      valuesObject:
        reloader:
          watchGlobally: true
          reloadOnCreate: false
          deployment:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { cpu: 100m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
