# ClusterIssuers do Let's Encrypt com DNS-01 no Cloudflare (permite certificado wildcard).
# Antes: Secret com o token (Zone:DNS:Edit + Zone:Zone:Read, restrito à zona):
#   read -rs CF_TOKEN && kubectl -n cert-manager create secret generic cloudflare-api-token \
#     --from-literal=api-token="$CF_TOKEN"; unset CF_TOKEN
# Trocar <EMAIL> e aplicar: kubectl apply -f cluster-issuers.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: <EMAIL>
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: <EMAIL>
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
