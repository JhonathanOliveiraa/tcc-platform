# Ponte entre o cluster e o OCI Vault "tcc" (tenancy pessoal). Autenticação por Instance Principal:
# a VM se identifica na OCI, sem credencial no cluster. Pré-requisitos criados pelo oci-bootstrap.sh
# (Dynamic Group k3s-jhone + Policy tcc-eso-le-vault).
# Só namespaces de aplicação do TCC (label tcc/ambiente) usam este store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: oci-vault-tcc
spec:
  provider:
    oracle:
      vault: VAULT_OCID
      region: sa-saopaulo-1
      principalType: InstancePrincipal
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: tcc/ambiente
            operator: In
            values: [hml, prd]
