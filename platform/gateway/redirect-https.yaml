# HTTP -> HTTPS (301) para os hosts atendidos pelo Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https
  namespace: kong
spec:
  parentRefs:
    - name: kong
      sectionName: http
  hostnames:
    - argo.altasistemas.com.br
    - "*.tcc.altasistemas.com.br"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
