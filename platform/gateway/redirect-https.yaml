# Todo HTTP da subzona vai para HTTPS (301).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tcc-redirect-https
  namespace: kong
spec:
  parentRefs:
    - name: tcc
      sectionName: http
  hostnames:
    - "*.tcc.altasistemas.com.br"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
