# Entrada HTTP/HTTPS do cluster pela Gateway API.
# Pré-requisitos: crds/ aplicado + kong-controller reiniciado; certificado.yaml Ready;
# platform/argocd/ aplicado (ReferenceGrant do argo-tls).
# redirect-https.yaml: uma rota por host, SEMPRE com requestRedirect.hostname (sem ele o Kong 3.9
# recusa a configuração inteira; ver README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gatewayclass.yaml
  - gateway.yaml
  - redirect-https.yaml
