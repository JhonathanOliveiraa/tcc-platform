# Entrada HTTP/HTTPS do cluster pela Gateway API.
# Pré-requisitos: crds/ aplicado + kong-controller reiniciado; certificado.yaml Ready;
# platform/argocd/ aplicado (ReferenceGrant do argo-tls).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gatewayclass.yaml
  - gateway.yaml
  - redirect-https.yaml
