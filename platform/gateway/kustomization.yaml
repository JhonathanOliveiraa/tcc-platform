# Entrada HTTP/HTTPS do cluster pela Gateway API.
# Pré-requisitos: crds/ aplicado + kong-controller reiniciado; certificado.yaml Ready;
# platform/argocd/ aplicado (ReferenceGrant do argo-tls).
# Sem redirect HTTP->HTTPS no cluster (HTTP responde 426): ver redirect-https.yaml.desativado.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gatewayclass.yaml
  - gateway.yaml
