# Gateway da plataforma: HTTPS para *.tcc.altasistemas.com.br e HTTP só para redirecionar.
# Só namespaces com o label tcc/exposto=true podem anexar HTTPRoute ao listener HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tcc
  namespace: kong
spec:
  gatewayClassName: kong
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.tcc.altasistemas.com.br"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tcc-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              tcc/exposto: "true"
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.tcc.altasistemas.com.br"
      allowedRoutes:
        namespaces:
          from: Same
