# UI do Argo CD em https://argo.<DOMINIO>, liberada só para IPs conhecidos.
# Pré-requisitos: DNS "argo" (A → IP público, sem proxy), Kong com externalTrafficPolicy=Local,
# ClusterIssuer letsencrypt-prod. Depois de aplicar:
#   kubectl -n argocd annotate svc argocd-server konghq.com/protocol=https --overwrite
# (o argocd-server serve HTTPS autoassinado na 8080; o Kong precisa falar HTTPS com ele)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argo-tls
  namespace: argocd
spec:
  secretName: argo-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - argo.<DOMINIO>
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: argo-ip-restriction
  namespace: argocd
plugin: ip-restriction
config:
  allow:
    - <SEU_IP>          # IP público de onde você administra
  status: 403
  message: "Acesso restrito"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    konghq.com/plugins: argo-ip-restriction
    konghq.com/protocols: https
    konghq.com/https-redirect-status-code: "301"
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - argo.<DOMINIO>
      secretName: argo-tls
  rules:
    - host: argo.<DOMINIO>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: https
