# Teste da matriz de hosts no Kong ANTES de publicar aplicações (backends falsos "whoami").
# Aplicar:  kubectl create ns route-test && kubectl -n route-test apply -f teste-roteamento.yaml
# Testar:   for h in api prod-tenant hml-api x.hml; do ... (ver RECONSTRUIR_CLUSTER.md, Fase 4)
# Remover:  kubectl delete ns route-test
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-prod }
spec:
  selector: { matchLabels: { app: api-prod } }
  template:
    metadata: { labels: { app: api-prod } }
    spec:
      containers:
        - { name: w, image: traefik/whoami:v1.10, env: [ { name: WHOAMI_NAME, value: api-prod } ], ports: [ { containerPort: 80 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: front-prod }
spec:
  selector: { matchLabels: { app: front-prod } }
  template:
    metadata: { labels: { app: front-prod } }
    spec:
      containers:
        - { name: w, image: traefik/whoami:v1.10, env: [ { name: WHOAMI_NAME, value: front-prod } ], ports: [ { containerPort: 80 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-hml }
spec:
  selector: { matchLabels: { app: api-hml } }
  template:
    metadata: { labels: { app: api-hml } }
    spec:
      containers:
        - { name: w, image: traefik/whoami:v1.10, env: [ { name: WHOAMI_NAME, value: api-hml } ], ports: [ { containerPort: 80 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: front-hml }
spec:
  selector: { matchLabels: { app: front-hml } }
  template:
    metadata: { labels: { app: front-hml } }
    spec:
      containers:
        - { name: w, image: traefik/whoami:v1.10, env: [ { name: WHOAMI_NAME, value: front-hml } ], ports: [ { containerPort: 80 } ] }
---
apiVersion: v1
kind: Service
metadata: { name: api-prod }
spec: { selector: { app: api-prod }, ports: [ { port: 80 } ] }
---
apiVersion: v1
kind: Service
metadata: { name: front-prod }
spec: { selector: { app: front-prod }, ports: [ { port: 80 } ] }
---
apiVersion: v1
kind: Service
metadata: { name: api-hml }
spec: { selector: { app: api-hml }, ports: [ { port: 80 } ] }
---
apiVersion: v1
kind: Service
metadata: { name: front-hml }
spec: { selector: { app: front-hml }, ports: [ { port: 80 } ] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: api-prod }
spec:
  ingressClassName: kong
  rules: [ { host: api.<DOMINIO>, http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: api-prod, port: { number: 80 } } } } ] } } ]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: front-prod }
spec:
  ingressClassName: kong
  rules: [ { host: "*.<DOMINIO>", http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: front-prod, port: { number: 80 } } } } ] } } ]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: api-hml }
spec:
  ingressClassName: kong
  rules: [ { host: hml-api.<DOMINIO>, http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: api-hml, port: { number: 80 } } } } ] } } ]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: front-hml }
spec:
  ingressClassName: kong
  rules: [ { host: "*.hml.<DOMINIO>", http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: front-hml, port: { number: 80 } } } } ] } } ]
