# Rota da aplicação no Gateway kong/kong, listener https-tcc (*.tcc.altasistemas.com.br).
# O namespace precisa do label tcc/exposto=true. O host é definido no overlay do ambiente.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    # group/kind explícitos: são os defaults gravados pela API; sem eles o Argo CD acusa OutOfSync.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong
      namespace: kong
      sectionName: https-tcc
  hostnames:
    - definido-no-overlay.tcc.altasistemas.com.br
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: app
          port: 80
          weight: 1
