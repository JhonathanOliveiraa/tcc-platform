# Pull das imagens privadas do GHCR. Token (read:packages) no OCI Vault, o mesmo para todos os
# ambientes: TCC-GHCR-USUARIO e TCC-GHCR-TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault-tcc
  target:
    name: ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .usuario }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .usuario .token | b64enc }}"}}}'
  data:
    - secretKey: usuario
      remoteRef: { key: TCC-GHCR-USUARIO }
    - secretKey: token
      remoteRef: { key: TCC-GHCR-TOKEN }
