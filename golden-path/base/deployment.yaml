# Contrato do contêiner (README do golden path e dos repositórios das apps):
# porta 8080 "http", usuário não-root, raiz somente leitura, sem capabilities, /tmp gravável.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    # Reloader: Secret/ConfigMap alterado (ex.: segredo trocado no OCI Vault) → rolling update.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: app
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: app
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: app   # substituída no base de cada aplicação
          ports:
            - name: http
              containerPort: 8080
          env:
            # Receptor OTLP do Grafana Alloy no cluster (exporta ao Grafana Cloud).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://grafana-cloud-otel-receiver.monitoring.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
