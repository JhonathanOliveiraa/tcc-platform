# Credenciais do PostgreSQL vindas do OCI Vault; o mesmo Secret alimenta o banco (POSTGRES_*) e a
# API (ConnectionStrings__Catalogo, AD-8). As chaves do Vault são definidas no overlay do ambiente.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalogo-api-segredos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault-tcc
  target:
    name: catalogo-api-segredos
    creationPolicy: Owner
    template:
      data:
        POSTGRES_USER: "{{ .usuario }}"
        POSTGRES_PASSWORD: "{{ .senha }}"
        ConnectionStrings__Catalogo: "Host=postgres;Port=5432;Database=catalogo;Username={{ .usuario }};Password={{ .senha }}"
  data:
    - secretKey: usuario
      remoteRef: { key: definido-no-overlay }
    - secretKey: senha
      remoteRef: { key: definido-no-overlay }
