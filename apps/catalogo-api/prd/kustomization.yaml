# catalogo-api em prd: https://catalogo-api.tcc.altasistemas.com.br
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: catalogo-api-prd
resources:
  - ../base
patches:
  - path: deployment.yaml
  - target:
      kind: HTTPRoute
      name: app
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: catalogo-api.tcc.altasistemas.com.br
  - target:
      kind: ExternalSecret
      name: catalogo-api-segredos
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: PRD-TCC-CATALOGO-API-POSTGRES-USUARIO
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: PRD-TCC-CATALOGO-API-POSTGRES-SENHA
images:
  # A esteira (tcc-pipeline-templates) grava aqui a tag de cada build.
  - name: ghcr.io/jhonathanoliveiraa/catalogo-api
    newTag: sha-0b8c8ed5a154
    digest: sha256:3597e365f8249ba869637e526e767bbf129a1bd0b1d64e9ebd6567e0a0bd7327
