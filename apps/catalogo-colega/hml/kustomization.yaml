apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: catalogo-colega-hml
resources:
  - ../base
patches:
  - path: deployment.yaml
  - target:
      kind: HTTPRoute
      name: app
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: hml-catalogo-colega.tcc.altasistemas.com.br
images:
  - name: ghcr.io/jhonathanoliveiraa/catalogo-colega
    newTag: inicial
