apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/jhonathanoliveiraa/catalogo-front
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # /healthz (probes do base) não depende da API. O nginx-unprivileged precisa gravar em
          # /var/cache/nginx; o config.json é gerado em /tmp (emptyDir do base).
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-cache
          emptyDir: {}
