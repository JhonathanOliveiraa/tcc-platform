# catalogo-front em hml: https://hml-catalogo.tcc.altasistemas.com.br
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: catalogo-front-hml
resources:
  - ../base
patches:
  - path: deployment.yaml
  - target:
      kind: HTTPRoute
      name: app
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: hml-catalogo.tcc.altasistemas.com.br
images:
  # A esteira (tcc-pipeline-templates) grava aqui a tag de cada build.
  - name: ghcr.io/jhonathanoliveiraa/catalogo-front
    newTag: sha-e349a87318ac
    digest: sha256:8f6a44a97a07f5a5603efe364dd18538bda4bbacc03ca3c9b5d61427d40eea44
